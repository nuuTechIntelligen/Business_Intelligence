<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Cocina / KDS - La Engordadera</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #E91E63;
            --primary-yellow: #FFC107;
            --primary-green: #10B981;
            --primary-blue: #0284C7;
            --dark-bg: #111827;
            --card-bg: #1F2937;
            --font-heading: 'Fredoka', cursive, sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--dark-bg);
            color: #F9FAFB;
            padding: 14px;
            min-height: 100vh;
        }

        /* HEADER */
        .kds-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid #374151;
        }
        .kds-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--primary-pink);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .kds-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-heading);
            font-size: 0.88rem;
        }
        .stat-badge {
            background: #374151;
            padding: 5px 12px;
            border-radius: 20px;
        }

        /* GRID DE COMANDAS */
        .kds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        /* TARJETA DE COMANDA */
        .order-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px solid #374151;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-pink);
        }

        .order-card-header {
            padding: 10px 14px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #374151;
        }
        .order-turno {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-yellow);
        }
        .order-type-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 14px;
            text-transform: uppercase;
        }
        .badge-tienda { background: #0284C7; color: white; }
        .badge-recoger { background: #EA580C; color: white; }

        .order-timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            font-size: 0.78rem;
            background: #283548;
            border-bottom: 1px solid #374151;
        }
        .order-timer {
            font-family: monospace;
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .timer-normal { color: #10B981; }
        .timer-warning { color: #F59E0B; }
        .timer-danger { color: #EF4444; }

        .payment-status {
            font-weight: 700;
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .pay-paid { background: #065F46; color: #34D399; }
        .pay-pending { background: #78350F; color: #FCD34D; }

        .order-card-body {
            padding: 12px 14px;
            flex: 1;
            max-height: 260px;
            overflow-y: auto;
        }
        .order-item-row {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #374151;
        }
        .order-item-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .order-item-title {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            color: #FFFFFF;
            display: flex;
            justify-content: space-between;
        }
        .order-item-sub {
            font-size: 0.78rem;
            color: #9CA3AF;
            margin-top: 2px;
            line-height: 1.35;
        }

        .order-card-footer {
            padding: 10px 14px;
            background: #111827;
            display: flex;
            gap: 8px;
            border-top: 1px solid #374151;
        }
        .btn-kds {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-prep { background: #3B82F6; color: white; }
        .btn-ready { background: var(--primary-green); color: white; }
        .btn-delivered { background: #6B7280; color: white; }

        /* MODAL DE DETALLE Y COBRO */
        .kds-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .kds-modal-overlay.active { display: flex; }

        .kds-modal-card {
            background: var(--card-bg);
            border: 2px solid var(--primary-pink);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            border-radius: 18px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            color: #F9FAFB;
        }
        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #9CA3AF;
            cursor: pointer;
        }
        .pay-method-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0 14px 0;
        }
        .pay-method-btn {
            background: #374151;
            color: white;
            border: 1.5px solid #4B5563;
            padding: 10px;
            border-radius: 10px;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }
        .pay-method-btn.active {
            background: var(--primary-pink);
            border-color: #F472B6;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="kds-header">
        <div class="kds-title">
            <i class="fa-solid fa-fire-burner"></i>
            <span>Comandas / Cocina</span>
        </div>
        <div class="kds-stats">
            <span class="stat-badge"><i class="fa-solid fa-clock"></i> Pendientes: <strong id="kdsCountPending">0</strong></span>
            <span class="stat-badge"><i class="fa-solid fa-utensils"></i> En Prep: <strong id="kdsCountPrep">0</strong></span>
            <button onclick="cargarPedidosCocina()" class="btn-kds btn-prep" style="padding:5px 12px; font-size:0.75rem;">
                <i class="fa-solid fa-rotate"></i> Actualizar
            </button>
        </div>
    </header>

    <!-- GRID DE PEDIDOS -->
    <main class="kds-grid" id="kdsOrdersContainer">
        <div style="text-align:center; grid-column:1/-1; padding:40px; color:#9CA3AF;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; margin-bottom:10px;"></i>
            <p>Conectando con la base de datos...</p>
        </div>
    </main>

    <!-- MODAL DE DETALLE Y COBRO -->
    <div class="kds-modal-overlay" id="kdsDetailModal">
        <div class="kds-modal-card">
            <button class="modal-close-btn" onclick="cerrarModalCocina()">&times;</button>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #374151; padding-bottom:10px;">
                <div>
                    <h2 style="font-family:var(--font-heading); color:var(--primary-yellow); font-size:1.8rem;" id="modalTurno">#R-01</h2>
                    <span id="modalCliente" style="color:#D1D5DB; font-size:0.95rem; font-weight:600;">Cliente: Juan</span>
                </div>
                <span id="modalBadgeTipo" class="order-type-badge badge-recoger">PARA RECOGER</span>
            </div>

            <!-- CONTACTO -->
            <div style="margin-bottom:14px; background:#111827; padding:10px 14px; border-radius:10px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <small style="color:#9CA3AF; display:block;">Celular del Cliente:</small>
                    <strong id="modalTelefono" style="font-size:0.95rem;">-</strong>
                </div>
                <div id="modalContactActions" style="display:flex; gap:6px;"></div>
            </div>

            <!-- DETALLE DE ITEMS -->
            <h4 style="font-family:var(--font-heading); color:#F472B6; margin-bottom:8px;">📝 Detalle del Pedido:</h4>
            <div id="modalItemsList" style="background:#111827; border-radius:12px; padding:12px; margin-bottom:14px; max-height:220px; overflow-y:auto;"></div>

            <!-- SECCIÓN DE COBRO EN TIENDA -->
            <div id="modalPaymentSection" style="margin-bottom:16px; background:#111827; padding:12px; border-radius:12px; border:1px dashed #4B5563;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.85rem; color:#9CA3AF;">Total a Cobrar:</span>
                    <strong style="font-size:1.2rem; color:var(--primary-green);" id="modalTotalMonto">$0.00</strong>
                </div>

                <div style="margin-top:8px;">
                    <small style="color:#D1D5DB; display:block; margin-bottom:4px;">Marcar cómo se cobró en mostrador:</small>
                    <div class="pay-method-grid">
                        <button type="button" class="pay-method-btn" onclick="seleccionarMetodoPago('Efectivo', this)">💵 Efectivo</button>
                        <button type="button" class="pay-method-btn" onclick="seleccionarMetodoPago('Tarjeta', this)">💳 Tarjeta</button>
                        <button type="button" class="pay-method-btn" onclick="seleccionarMetodoPago('Transferencia', this)">⚡ Transf / MP</button>
                    </div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN DE ESTADO -->
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button type="button" class="btn-kds btn-prep" id="btnModalPrep" onclick="cambiarEstadoDesdeModal('preparando')">
                    <i class="fa-solid fa-fire"></i> Pasar a Preparación
                </button>
                <button type="button" class="btn-kds btn-ready" id="btnModalReady" onclick="cambiarEstadoDesdeModal('listo')">
                    <i class="fa-solid fa-bell"></i> Marcar como LISTO para Entrega
                </button>
                <button type="button" class="btn-kds btn-delivered" id="btnModalDelivered" onclick="cambiarEstadoDesdeModal('entregado')">
                    <i class="fa-solid fa-check-double"></i> Entregado / Archivar
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT SEPARADO -->
    <script src="kds.js?v=101"></script>
</body>
</html>
