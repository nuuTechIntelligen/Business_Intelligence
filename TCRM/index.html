<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Talentum CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-28">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
          T
        </div>
        <div>
          <h1 class="text-base font-bold leading-none text-slate-900">Talentum</h1>
          <span class="text-xs text-slate-500 font-medium">Control de Procesos</span>
        </div>
      </div>
      <button id="btnReload" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:scale-95 transition-transform">
        <i class="ph ph-arrows-clockwise text-lg"></i>
      </button>
    </div>

    <!-- BUSCADOR -->
    <div class="mt-3 relative">
      <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-base"></i>
      <input 
        type="text" 
        id="inputSearch" 
        placeholder="Buscar por puesto, cliente o región..." 
        class="w-full bg-slate-100 pl-9 pr-4 py-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-400"
      />
    </div>

    <!-- FILTROS RÁPIDOS -->
    <div class="flex items-center gap-2 mt-3 overflow-x-auto no-scrollbar pb-0.5" id="filterChipsContainer">
      <button data-filter="En Proceso" class="chip-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-indigo-600 text-white shadow-sm transition-all">
        🔵 En Proceso
      </button>
      <button data-filter="Garantia" class="chip-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
        🛡️ En Garantía
      </button>
      <button data-filter="Contratado" class="chip-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
        ✓ Contratadas
      </button>
      <button data-filter="Todas" class="chip-filter px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
        Todas
      </button>
    </div>
  </header>

  <!-- RESUMEN FINANCIERO -->
  <section class="px-4 mt-3">
    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Fees en Proceso</span>
        <p id="totalFeesActivos" class="text-lg font-black text-slate-800 mt-0.5">$0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Inversión Pauta</span>
        <p id="totalInversion" class="text-lg font-black text-rose-600 mt-0.5">$0</p>
      </div>
    </div>
  </section>

  <!-- FEED DE VACANTES -->
  <main id="vacantesContainer" class="px-4 mt-3 flex flex-col gap-3"></main>

  <!-- BOTÓN FLOTANTE Y MENÚ DE ACCIONES (FAB) -->
  <div class="fixed bottom-5 right-5 z-20 flex flex-col items-end gap-2">
    <div id="fabMenu" class="hidden flex-col items-end gap-2 transition-all">
      <button id="btnOpenModalVacante" class="flex items-center gap-2 bg-white text-indigo-600 px-4 py-2.5 rounded-full shadow-lg border border-slate-100 text-xs font-bold active:scale-95 transition-all">
        <span>+ Nueva Vacante</span>
        <i class="ph ph-briefcase text-base"></i>
      </button>
      <button id="btnOpenModalHora" class="flex items-center gap-2 bg-white text-indigo-600 px-4 py-2.5 rounded-full shadow-lg border border-slate-100 text-xs font-bold active:scale-95 transition-all">
        <span>+ Registrar Horas</span>
        <i class="ph ph-clock text-base"></i>
      </button>
    </div>
    <button id="btnFab" class="h-14 w-14 rounded-full bg-indigo-600 text-white shadow-xl shadow-indigo-600/30 flex items-center justify-center text-2xl active:scale-90 transition-transform">
      <i id="fabIcon" class="ph ph-plus-bold"></i>
    </button>
  </div>

  <!-- BACKDROP GENERAL -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

  <!-- MODAL 1: REGISTRAR GASTO -->
  <div id="modalSheetGasto" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl p-5 z-50 transform translate-y-full bottom-sheet max-w-lg mx-auto shadow-2xl border-t border-slate-100">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-slate-900">Registrar Gasto / Inversión</h2>
      <button class="btn-close-modal text-slate-400 p-1"><i class="ph ph-x text-xl"></i></button>
    </div>
    <form id="formGasto" class="flex flex-col gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-500">Vacante</label>
        <select id="modalGastoVacante" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium"></select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Categoría</label>
          <select id="modalGastoCategoria" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium">
            <option value="Facebook Ads">Facebook Ads</option>
            <option value="LinkedIn">LinkedIn</option>
            <option value="Psicometría">Psicometría</option>
            <option value="Bolsas de Empleo">Bolsa de Empleo</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Monto ($)</label>
          <input type="number" step="0.01" id="modalGastoMonto" required placeholder="0.00" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
      </div>
      <button type="submit" class="mt-2 w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-md shadow-indigo-600/20 active:scale-98 transition-transform">
        Guardar Gasto
      </button>
    </form>
  </div>

  <!-- MODAL 2: REGISTRAR HORAS (TIME TRACKING) -->
  <div id="modalSheetHora" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl p-5 z-50 transform translate-y-full bottom-sheet max-w-lg mx-auto shadow-2xl border-t border-slate-100">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-slate-900">Registrar Horas de Consultoría</h2>
      <button class="btn-close-modal text-slate-400 p-1"><i class="ph ph-x text-xl"></i></button>
    </div>
    <form id="formHora" class="flex flex-col gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-500">Vacante</label>
        <select id="modalHoraVacante" required class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium"></select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Consultor</label>
          <input type="text" id="modalHoraConsultor" required placeholder="Ej. Ana / Carlos" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Horas Invertidas</label>
          <input type="number" step="0.5" id="modalHoraCantidad" required placeholder="1.5" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Costo/Hora ($)</label>
          <input type="number" id="modalHoraCosto" required value="150" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Etapa</label>
          <select id="modalHoraEtapa" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium">
            <option value="Sourcing / Filtro">Sourcing / Filtro</option>
            <option value="Entrevistas">Entrevistas</option>
            <option value="Presentación de Terna">Presentación Terna</option>
            <option value="Validación / Oferta">Validación / Oferta</option>
          </select>
        </div>
      </div>
      <button type="submit" class="mt-2 w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-md shadow-indigo-600/20 active:scale-98 transition-transform">
        Guardar Tiempo
      </button>
    </form>
  </div>

  <!-- MODAL 3: NUEVA VACANTE / CLIENTE -->
  <div id="modalSheetVacante" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl p-5 z-50 transform translate-y-full bottom-sheet max-w-lg mx-auto shadow-2xl border-t border-slate-100 max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-slate-900">Alta de Nueva Vacante</h2>
      <button class="btn-close-modal text-slate-400 p-1"><i class="ph ph-x text-xl"></i></button>
    </div>
    <form id="formVacante" class="flex flex-col gap-3">
      <div>
        <label class="text-xs font-semibold text-slate-500">Cliente / Empresa</label>
        <div class="flex gap-2 mt-1">
          <select id="modalVacanteCliente" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium"></select>
          <button type="button" id="btnToggleNuevoCliente" class="px-3 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold border border-slate-200">+ Cliente</button>
        </div>
      </div>

      <!-- Sección condicional para nuevo cliente -->
      <div id="boxNuevoCliente" class="hidden p-3 bg-slate-50 rounded-xl border border-slate-200 flex flex-col gap-2">
        <span class="text-xs font-bold text-indigo-600">Datos de la Nueva Empresa</span>
        <input type="text" id="nuevoClienteNombre" placeholder="Razón Social / Nombre Comercial" class="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none" />
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="nuevoClienteRegion" placeholder="Región (ej. Querétaro)" class="bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none" />
          <input type="text" id="nuevoClienteWhatsApp" placeholder="WhatsApp Contacto" class="bg-white border border-slate-200 rounded-lg p-2 text-xs outline-none" />
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-500">Título del Puesto</label>
        <input type="text" id="nuevaVacantePuesto" required placeholder="Ej. Gerente de Operaciones" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Servicio Base</label>
          <select id="modalVacanteServicio" onchange="actualizarValoresServicio()" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium"></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Días Garantía</label>
          <input type="number" id="nuevaVacanteGarantia" required value="30" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-500">Fee Total Pactado ($)</label>
          <input type="number" id="nuevaVacanteFee" required placeholder="25000" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500">Monto Anticipo ($)</label>
          <input type="number" id="nuevaVacanteAnticipo" required placeholder="12500" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-indigo-500 font-medium" />
        </div>
      </div>

      <button type="submit" class="mt-2 w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-sm shadow-md shadow-indigo-600/20 active:scale-98 transition-transform">
        Dar de Alta Vacante
      </button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
